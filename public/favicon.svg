<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="helenaFaviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="helenaFaviconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="helenaFaviconVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="helenaFaviconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base container squircle -->
  <rect width="64" height="64" rx="16" fill="url(#helenaFaviconBg)" stroke="#27272a" stroke-width="2"/>

  <!-- Pulse Aura -->
  <circle cx="32" cy="33" r="23" fill="#d97706" opacity="0.15" filter="url(#helenaFaviconGlow)"/>

  <!-- Antenna -->
  <line x1="32" y1="11" x2="32" y2="17" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="10" r="3" fill="#38bdf8" filter="url(#helenaFaviconGlow)"/>

  <!-- Robot Head Outline / Shell -->
  <rect x="14" y="17" width="36" height="30" rx="9" fill="url(#helenaFaviconGold)" />

  <!-- Side Ears / Sensors -->
  <rect x="10.5" y="24" width="3.5" height="14" rx="1.5" fill="#f59e0b" opacity="0.9"/>
  <rect x="50" y="24" width="3.5" height="14" rx="1.5" fill="#f59e0b" opacity="0.9"/>

  <!-- Face Screen / Visor Background -->
  <rect x="18" y="22" width="28" height="18" rx="5" fill="#0c0a09" stroke="#292524" stroke-width="1.2"/>

  <!-- Glowing Digital Eyes -->
  <rect x="22.5" y="26.5" width="6.5" height="7.5" rx="3.25" fill="#38bdf8" filter="url(#helenaFaviconGlow)"/>
  <rect x="35" y="26.5" width="6.5" height="7.5" rx="3.25" fill="#38bdf8" filter="url(#helenaFaviconGlow)"/>

  <!-- High-tech Grid / Mouth line -->
  <path d="M27 35.5h10" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Cybernetic Chest Collar detail -->
  <path d="M22 51h20l-3 4H25l-3-4z" fill="#d97706" opacity="0.8"/>
</svg>
