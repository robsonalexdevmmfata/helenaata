# Backend WhatsApp (Baileys) no Render. Front fica na Vercel.
# Plano free: sem disco persistente — o QR precisa ser lido de novo se o serviço reiniciar.
services:
  - type: web
    name: helena-ai
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/robsonalexdevmmfata/helenaata
    branch: main
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server/index.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NPM_CONFIG_ENGINE_STRICT
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: WHATSAPP_AUTH_DIR
        value: data/whatsapp-auth
      - key: HELENA_AUTO_REPLY
        value: "true"
      - key: EVOLUTION_INSTANCE
        value: helena
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
