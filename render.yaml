# HELENA AI — Render (API + WhatsApp). Front na Vercel reescreve /api para cá.
# Evolution: Hostless. Tokens GitHub/Vercel do Time Dev: painel Render (não commitar).
services:
  - type: web
    name: helena-ai
    runtime: node
    region: frankfurt
    repo: https://github.com/robsonalexdevmmfata/sample-admin-harbor
    branch: main
    buildCommand: npm ci && npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        value: "*"
      - key: WHATSAPP_AUTH_DIR
        value: /opt/render/project/src/data/whatsapp-auth
      - key: HELENA_AUTO_REPLY
        value: "true"
      - key: EVOLUTION_INSTANCE
        value: hudemo
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EVOLUTION_URL
        value: https://evolutionapi.hostless.app
      - key: EVOLUTION_KEY
        sync: false
      - key: VITE_EVOLUTION_URL
        value: https://evolutionapi.hostless.app
      - key: VITE_EVOLUTION_INSTANCE
        value: hudemo
      - key: VITE_PUBLIC_SITE_URL
        value: https://helenaata.vercel.app
      - key: GITHUB_TOKEN
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: CAKTO_CLIENT_ID
        sync: false
      - key: CAKTO_CLIENT_SECRET
        sync: false
      - key: CAKTO_WEBHOOK_SECRET
        sync: false
    disk:
      name: helena-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
