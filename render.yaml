services:
  - type: web
    name: helena-ai
    runtime: node
    region: oregon
    buildCommand: npm ci && npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: GROQ_API_KEY
        sync: false
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: EVOLUTION_URL
        sync: false
      - key: EVOLUTION_KEY
        sync: false
      - key: CAKTO_CLIENT_ID
        sync: false
      - key: CAKTO_CLIENT_SECRET
        sync: false
    disk:
      name: helena-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
